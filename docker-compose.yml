services:
  mongo:
    image: mongo:7
    container_name: tracking-mongo
    ports:
      - "27018:27017"
    volumes:
      - tracking-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: tracking-redis
    ports:
      - "6380:6379"
    volumes:
      - tracking-redis-data:/data

# RabbitMQ is the shared platform broker (logistics-rabbitmq on :5672).
# Bring it up via logistics-infrastructure/compose, and point RABBITMQ_URL at it.

volumes:
  tracking-mongo-data:
  tracking-redis-data:
